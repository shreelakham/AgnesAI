<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Strategy Deck</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/theme/black.min.css">

<style>
  :root{
    --ink:#0E141B; --panel:#161E27; --line:#26313D;
    --text:#E6E9ED; --muted:#8A97A6;
    --target:#FF6A5A; --rival:#5C6A7A; --teal:#4FD1C5; --amber:#F5C451;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"Georgia","Iowan Old Style","Times New Roman",serif;
    --display:var(--sans); /* swapped at runtime based on theme.font */
  }
  .reveal{ font-family:var(--display); color:var(--text); background:var(--bg, var(--ink)); }
  .reveal .slides section{ background:var(--bg, var(--ink)) !important; text-align:left;
                            display:flex !important; flex-direction:column !important; height:100% !important; box-sizing:border-box; }

  /* mood tweaks — applied via [data-mood] on <html> */
  [data-mood="editorial"] h1, [data-mood="editorial"] h2{ font-style:italic; }
  [data-mood="bold"]      h1, [data-mood="bold"]      h2{ letter-spacing:-.03em; }
  [data-mood="playful"]   .media, [data-mood="playful"] .impact-stat{ border-radius:20px; }
  [data-mood="minimal"]   .eyebrow{ letter-spacing:.32em; }

  .reveal h1,.reveal h2{ color:var(--text); text-transform:none; letter-spacing:-.02em; font-weight:700; margin:0 0 .25em; }
  .reveal h1{ font-size:1.9em; line-height:1.12; }
  .reveal h2{ font-size:1.3em; }
  .reveal .lead{ font-size:.95em; color:var(--text); margin:.35em 0 0; max-width:42em; }
  .reveal p,.reveal li{ color:var(--text); font-size:.68em; line-height:1.45; }

  .eyebrow{ font-family:var(--mono); font-size:.5em; letter-spacing:.22em; text-transform:uppercase; color:var(--teal); margin:0 0 .4em; }
  .sub{ color:var(--muted); margin-top:.4em; }
  .caption{ color:var(--muted); margin-top:.5em; font-size:.7em; }

  /* tag-style pills for competitor / product lists */
  .pill{ display:inline-block; padding:.25em .8em; border:1px solid var(--line); border-radius:999px;
         font-family:var(--mono); font-size:.45em; letter-spacing:.05em; margin:.2em .35em .2em 0; color:var(--muted); }

  /* severity badges on gap slides */
  .severity{ display:inline-block; font-family:var(--mono); font-size:.45em; letter-spacing:.2em;
             text-transform:uppercase; padding:.3em .7em; border-radius:5px; border:1px solid var(--line); }
  .severity-high{   color:var(--target); border-color:var(--target); }
  .severity-medium{ color:var(--amber);  border-color:var(--amber); }
  .severity-low{    color:var(--teal);   border-color:var(--teal); }

  .gap-why{ color:var(--muted); margin-top:.5em; max-width:46em; }

  /* projected-impact stat cards */
  .impact-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1em; margin-top:1em; max-width:50em; }
  .impact-stat{ border:1px dashed var(--line); border-radius:10px; padding:1em; background:var(--panel); }
  .impact-num{ font-size:1.6em; font-weight:700; color:var(--target); line-height:1.1; }
  .impact-label{ font-family:var(--mono); font-size:.42em; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; margin-top:.4em; }

  .closing-headline{ font-size:1.6em; font-weight:700; line-height:1.3; max-width:23em; }

  /* media (images / video) — media-wrap is a flex child that takes whatever
     vertical space is left after the text above it, so the image always
     fits regardless of how long the heading/body text is. */
  .media-wrap{ flex:1 1 auto; min-height:0; margin-top:.5em; }
  .visual-frame{ position:relative; height:100%; display:flex; align-items:center; justify-content:center; }
  .media{ max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; border-radius:12px; display:block; }
  .visual-tag{ position:absolute; top:.6em; left:.6em; background:var(--bg, var(--ink));
               border:1px solid var(--target); color:var(--target);
               font-family:var(--mono); font-size:.42em; letter-spacing:.18em;
               text-transform:uppercase; padding:.35em .8em; border-radius:4px; }
  .missing{ display:flex; align-items:center; justify-content:center; height:100%; width:100%; box-sizing:border-box;
            border:1px dashed var(--line); border-radius:12px; background:var(--panel);
            color:var(--muted); font-family:var(--mono); font-size:.5em; text-align:center; padding:1em; }

  .fatal{ font-family:var(--mono); color:var(--text); max-width:30em; line-height:1.6; }
  .fatal b{ color:var(--amber); }
</style>
</head>
<body>
<div class="reveal"><div class="slides" id="slides">
  <!-- slides are built from assets/analysis.json at load time -->
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.js"></script>
<script>
  const slides = document.getElementById("slides");

  // tiny helpers
  const section = inner => { const s=document.createElement("section"); s.innerHTML=inner; return s; };
  const esc = t => String(t).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

  // an <img>/<video> that swaps to a labelled placeholder if the file isn't there yet.
  // `label`, if given, is overlaid via CSS (not baked into the image — keeps text crisp).
  // Always wrapped in .media-wrap, which is the flex child that fills remaining slide height.
  function media(tag, src, alt, label){
    const el = tag==="video"
      ? `<video class="media" src="${esc(src)}" controls
          onerror="this.outerHTML='<div class=&quot;missing&quot;>${esc(alt)} — not generated yet (${esc(src)})</div>'"></video>`
      : `<img class="media" src="${esc(src)}" alt="${esc(alt)}"
          onerror="this.outerHTML='<div class=&quot;missing&quot;>${esc(alt)} — not generated yet (${esc(src)})</div>'">`;
    const inner = label
      ? `<div class="visual-frame">${el}<span class="visual-tag">${esc(label)}</span></div>`
      : el;
    return `<div class="media-wrap">${inner}</div>`;
  }

  // theme: a small, validated vocabulary Agnes can choose from.
  // Anything missing or malformed silently falls back to these defaults —
  // a bad theme should never be able to break the deck.
  const DEFAULT_THEME = {
    palette: { bg:"#0E141B", text:"#E6E9ED", accent:"#FF6A5A" },
    font: "sans",
    mood: "minimal"
  };
  const FONT_STACKS = { sans:'var(--sans)', serif:'var(--serif)', mono:'var(--mono)' };
  const HEX = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
  const MOODS = ["editorial","minimal","bold","playful"];

  function applyTheme(theme){
    const t = theme || {};
    const p = t.palette || {};
    const root = document.documentElement.style;

    root.setProperty("--bg",    HEX.test(p.bg)     ? p.bg     : DEFAULT_THEME.palette.bg);
    root.setProperty("--text",  HEX.test(p.text)   ? p.text   : DEFAULT_THEME.palette.text);
    root.setProperty("--target",HEX.test(p.accent) ? p.accent : DEFAULT_THEME.palette.accent);

    const font = FONT_STACKS[t.font] ? t.font : DEFAULT_THEME.font;
    root.setProperty("--display", FONT_STACKS[font]);

    const mood = MOODS.includes(t.mood) ? t.mood : DEFAULT_THEME.mood;
    document.documentElement.setAttribute("data-mood", mood);
  }

  /* =================================================================
     SLIDE NARRATIVE — built from the "gap analysis" schema:
       brand, brand_summary, competitive_position, likely_competitors,
       gaps[], solution_mapping[], recommended_package, projected_impact,
       headline_pitch — plus optional theme / images / video.
     ================================================================= */
  function build(data){
    applyTheme(data.theme);

    // 1 · title
    slides.appendChild(section(`
      <p class="eyebrow">Agnes AI Hackathon · Account Strategy</p>
      <h1>${esc(data.brand || "")}</h1>
      <p class="lead">${esc(data.headline_pitch || data.brand_summary || "")}</p>
    `));

    // 2 · where they stand today
    const competitorPills = (data.likely_competitors || [])
      .map(c => `<span class="pill">${esc(c)}</span>`).join("");
    slides.appendChild(section(`
      <p class="eyebrow">Step 1 · Where ${esc(data.brand || "they")} stand today</p>
      <h2>Competitive position</h2>
      <p class="sub" style="max-width:46em;">${esc(data.competitive_position || data.brand_summary || "")}</p>
      ${competitorPills ? `<div style="margin-top:1em;">${competitorPills}</div>` : ""}
    `));

    // 3 · one slide per gap
    const gaps = data.gaps || [];
    gaps.forEach((g, i) => {
      const sev = (g.severity || "medium").toLowerCase();
      slides.appendChild(section(`
        <p class="eyebrow">Step 2 · Gap ${i+1} of ${gaps.length}</p>
        <span class="severity severity-${esc(sev)}">${esc(sev)} severity</span>
        <h2 style="margin-top:.5em;">${esc(g.gap || "")}</h2>
        <p class="gap-why">${esc(g.why_it_matters || "")}</p>
        ${g.image ? media("img", g.image, g.gap || "Concept visual", "The problem") : ""}
      `));
    });

    // 4 · one slide per solution
    const solutions = data.solution_mapping || [];
    solutions.forEach((s, i) => {
      slides.appendChild(section(`
        <p class="eyebrow">Step 3 · Solution ${i+1} of ${solutions.length}</p>
        <h2>${esc(s.product || "")}</h2>
        <p class="sub" style="max-width:46em;"><b style="color:var(--target);">Addresses:</b> ${esc(s.gap_addressed || "")}</p>
        <p class="gap-why">${esc(s.how_it_helps || "")}</p>
        ${s.image ? media("img", s.image, s.product || "Concept visual", "The fix") : ""}
      `));
    });

    // 5 · recommended package
    if (data.recommended_package) {
      const pkg = data.recommended_package;
      const productPills = (pkg.included_products || [])
        .map(p => `<span class="pill">${esc(p)}</span>`).join("");
      slides.appendChild(section(`
        <p class="eyebrow">Step 4 · The recommendation</p>
        <h2>${esc(pkg.package_name || "Recommended package")}</h2>
        ${productPills ? `<div style="margin:.4em 0 .8em;">${productPills}</div>` : ""}
        <p class="gap-why" style="max-width:46em;">${esc(pkg.rationale || "")}</p>
        ${pkg.suggested_engagement ? `<p class="caption">Next step: ${esc(pkg.suggested_engagement)}</p>` : ""}
      `));
    }

    // 6 · projected impact
    if (data.projected_impact) {
      const pi = data.projected_impact;
      const rev = pi.revenue_or_profit_uplift;
      const eff = pi.time_or_efficiency_gain;
      const revCard = rev ? `
        <div class="impact-stat">
          <div class="impact-num">${esc(rev.low)}–${esc(rev.high)}</div>
          <div class="impact-label">Revenue / profit uplift${rev.timeframe ? " · " + esc(rev.timeframe) : ""}</div>
        </div>` : "";
      const effCard = eff ? `
        <div class="impact-stat">
          <div class="impact-num">${esc(eff.low)}–${esc(eff.high)}</div>
          <div class="impact-label">${esc(eff.what_it_speeds_up ? "Time saved · " + eff.what_it_speeds_up : "Time saved per week")}</div>
        </div>` : "";
      slides.appendChild(section(`
        <p class="eyebrow">Step 5 · Projected impact</p>
        <h2>What this is worth</h2>
        <div class="impact-grid">${revCard}${effCard}</div>
        ${pi.time_to_value ? `<p class="caption" style="margin-top:1em;">Time to value: ${esc(pi.time_to_value)}</p>` : ""}
        ${rev && rev.basis ? `<p class="caption">${esc(rev.basis)}</p>` : ""}
      `));
    }

    // 7 · optional marketing clip
    if (data.video) {
      slides.appendChild(section(`
        <p class="eyebrow">Step 6 · A sample execution</p>
        <h2>Example marketing clip</h2>
        ${media("video", data.video.src, "Marketing clip")}
        <p class="caption">${esc(data.video.caption || "")}</p>
      `));
    }

    // 8 · closing — headline pitch as the call to action
    const closing = data.headline_pitch || `Let's get ${data.brand || "there"} to the next stage.`;
    slides.appendChild(section(`
      <p class="eyebrow">From analysis to action</p>
      <p class="closing-headline">${esc(closing)}</p>
    `));

    Reveal.initialize({ hash:true, transition:"slide", width:1280, height:720 });
  }

  fetch("assets/analysis.json")
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(build)
    .catch(err => {
      slides.appendChild(section(`
        <div class="fatal">Couldn't load <b>assets/analysis.json</b> (${esc(err.message)}).<br><br>
        This deck reads your Agnes output over <b>http://</b>, so open it with a local server
        (VS Code "Live Server", or <b>python3 -m http.server</b>) — not by double-clicking the file.</div>
      `));
      Reveal.initialize();
    });
</script>
</body>
</html>
